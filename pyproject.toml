[project]
name = "swing-engine"
version = "0.1.0"
description = "Research, monitoring and paper-execution engine for US-equity swing trading with a Claude analyst layer"
readme = "README.md"
requires-python = ">=3.12,<3.14"
license = { text = "MIT" }
dependencies = [
  "pandas>=2.2",
  "numpy>=1.26",
  "duckdb>=1.1",
  "pyarrow>=17",
  "pydantic>=2.8",
  "pydantic-settings>=2.4",
  "pyyaml>=6",
  "typer>=0.12",
  "rich>=13",
  "httpx>=0.27",
  "websockets>=13",
  "feedparser>=6",
  "pandas-market-calendars>=4.4",
  "scikit-learn>=1.5",
  "lightgbm>=4.5",
  "anthropic>=0.40",
  "alpaca-py>=0.30",
  "edgartools>=4",
  "ahocorasick-rs>=0.22",
  "python-dotenv>=1.0",
  "structlog>=24",
]

[project.optional-dependencies]
vbt = ["vectorbt>=1.1"]
dev = ["pytest>=8", "pytest-asyncio>=0.24", "ruff>=0.6", "mypy>=1.11", "respx>=0.21"]

[project.scripts]
swing = "swing_engine.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["swing_engine"]

[tool.ruff]
line-length = 110
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = ["E501"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
