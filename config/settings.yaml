# Non-secret configuration. Secrets live in .env (see .env.example).
data:
  bar_provider: massive        # massive | eodhd | alpaca | sample
  history_years: 5
  store_path: data/swing.duckdb
  event_log_path: data/events.sqlite
  calendar: NYSE

universe:
  min_price: 5.0
  min_avg_dollar_volume: 5000000
  min_avg_volume: 500000
  exclude_otc: true
  include_etfs: false
  max_symbols: 1500
  static_symbols: []           # if non-empty, overrides the screened universe

risk:
  risk_per_trade_pct: 1.0      # Schwab example: $50k account, 1% = $500 risk, $2 trade risk -> 250 shares
  max_position_pct: 10.0
  max_open_positions: 8
  max_sector_pct: 30.0
  max_daily_loss_pct: 3.0
  max_drawdown_pct: 15.0
  min_reward_risk: 2.0
  vol_target_annual_pct: null
  kill_switch_file: state/KILL

strategies:                    # name -> {enabled, params}; names come from swing_engine/strategies/*.py
  sr_bounce:        {enabled: true}
  sr_breakout:      {enabled: true}
  pullback_trend:   {enabled: true}
  breakout_52w:     {enabled: true}
  momentum_burst:   {enabled: false}   # logged as a feature; weak standalone evidence
  rsi2_meanrev:     {enabled: true, min_reward_risk: 0.0}   # rule exit (close > sma_10 / rsi_2 > 70), no fixed target: skip the 2:1 floor
  insider_cluster:  {enabled: false}   # needs EDGAR Form 4 ingest

monitor:
  feeds: [alpaca_news, alpaca_stocks, alpaca_account, edgar, nasdaq_halts]
  watchlist: []
  keywords: []
  rvol_gate: 2.0
  gap_pct_alert: 8.0
  per_ticker_cooldown_min: 15
  hourly_alert_cap: 20
  quiet_hours_et: [22, 6]
  classify_model: claude-haiku-4-5
  smallcap:                    # see docs/smallcap-spec.md; posture is warn/fade, long alerts only in the early window
    enabled: true
    min_price: 1.0
    max_price: 20.0
    max_float_m: 20.0          # float unknown => warnings only, never long alerts
    preferred_float_m: 10.0
    max_market_cap_m: 200.0
    gap_pct_b_grade: 10.0
    gap_pct_a_grade: 20.0
    rvol_min: 5.0              # vs 30-day ADV, cumulative incl. pre-market
    premarket_volume_min: 50000
    premarket_volume_exhaustion: 50000000
    float_rotation_warn: 1.0
    float_rotation_no_trade: 5.0
    long_alert_cutoff_et: "09:45"
    never_long_after_et: "10:30"
    dilution_lookback_sessions: 5
    bagholder_alert_threshold: 6
    ramp_ipo_months: 24
    ramp_ipo_price_range: [4.0, 6.0]
    ramp_ipo_max_proceeds_m: 25.0
    ramp_ipo_max_shares_m: 20.0
    ramp_5d_gain_pct: 50.0
    ramp_20d_gain_pct: 100.0
    up_halts_climax: 2
    up_halts_exhaustion: 4
agent:
  review_model: claude-sonnet-5-5
  lab_model: claude-opus-5-5
  max_candidates_per_day: 20
