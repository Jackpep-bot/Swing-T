# Pre-registered batch-3 group (docs/preregistration/2026-10-10-batch3.md). Book limits fixed before any run.
# This file is the book of large_cap_residual_momentum (card: equal weight, max 50 names): 2% positions, 50 slots,
# the same limits as the batch-2 repurchasers book. large_cap_gross_profitability (max 60 names) runs on
# config/prereg_b3_gp.yaml (research.prereg_run --book). The grader reads the bars of this file's store.
# Store: a research copy of the repaired store, copied per job from data/live/replay_p3.duckdb by prereg_run.
extends: replay.yaml
data:
  store_path: data/live/replay_p3.duckdb
risk:
  risk_per_trade_pct: 0.5     # not binding below a 24% stop distance (3 x ATR63 of a top-500 stock): the cap sizes
  max_position_pct: 2.0       # equal weight: 1 / 50
  max_open_positions: 50
execution:
  max_new_orders_per_day: 50  # the first rebalance may buy the whole buy zone
